name: 'perch'
description: 'Fails when a feature branch is not based on the current base branch tip.'
inputs:
  feature:
    description: 'feature branch name'
    required: true
  base:
    description: 'base branch name'
    required: true
  token:
    description: 'GitHub token used to read branch refs'
    required: false
    default: ${{ github.token }}
runs:
  using: 'docker'
  image: 'Dockerfile'
  args:
    - ${{ inputs.feature }}
    - ${{ inputs.base }}
    - ${{ inputs.token }}
